<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Listener Chat</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; }
  h2 { margin-bottom: 4px; }
  p.sub { color: #666; margin-top: 0; }
  #chat-box {
    border: 1px solid #ccc; border-radius: 8px; height: 420px;
    padding: 12px; overflow-y: auto; background: #fafafa;
  }
  .msg { margin: 8px 0; padding: 8px 12px; border-radius: 10px; max-width: 80%; }
  .user { background: #d6e8ff; margin-left: auto; text-align: right; }
  .bot { background: #eee; }
  .row { display: flex; }
  #input-form { display: flex; margin-top: 12px; }
  #user-input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
  button { padding: 8px 16px; margin-left: 8px; border: none; border-radius: 6px;
    background: #2563eb; color: white; cursor: pointer; }
</style>
</head>
<body>

<h2>Listener Chat</h2>
<p class="sub">Ask a question about your account, billing, or the docs.</p>

<div id="chat-box"></div>

<form id="input-form">
  <input type="text" id="user-input" placeholder="Type your question..." autocomplete="off">
  <button type="submit">Send</button>
</form>

<script>
const chatBox = document.getElementById('chat-box');
const form = document.getElementById('input-form');
const input = document.getElementById('user-input');

function addMessage(text, sender) {
  const wrap = document.createElement('div');
  wrap.className = 'row';
  const bubble = document.createElement('div');
  bubble.className = 'msg ' + sender;
  bubble.textContent = text;
  wrap.appendChild(bubble);
  chatBox.appendChild(wrap);
  chatBox.scrollTop = chatBox.scrollHeight;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;
  addMessage(message, 'user');
  input.value = '';

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message })
    });
    const data = await res.json();
    addMessage(data.response, 'bot');
  } catch (err) {
    addMessage("Sorry, something went wrong reaching the server.", 'bot');
  }
});
</script>

</body>
</html>
